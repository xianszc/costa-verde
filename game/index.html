<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZZURRA — Porto Azzurra</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1e2a32;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #title-card { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: #f7ebd7; text-shadow: 0 2px 18px rgba(0,0,0,0.55); }
  #title-card h1 { margin: 0; font-size: 84px; letter-spacing: 14px; font-weight: 800; }
  #title-card p.tag { margin: 6px 0 0; font-size: 17px; letter-spacing: 2px; color: #f2a541; }
  #title-card p.press { margin-top: 34px; font-size: 15px; letter-spacing: 3px;
    animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  #topbar { position: absolute; top: 0; left: 0; right: 0; display: flex;
    justify-content: space-between; padding: 14px 18px; color: #f7ebd7;
    font-size: 14px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  #version { position: absolute; bottom: 12px; left: 16px; color: rgba(247,235,215,0.75);
    font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="topbar"><span>PORTO AZZURRA</span><span id="clock">18:42 · GOLDEN HOUR</span><span>S 1,250</span></div>
  <div id="title-card">
    <h1>AZZURRA</h1>
    <p class="tag">A CLIFFSIDE RIVIERA · A HARBOR FULL OF SECRETS · ONE LAST SCORE</p>
    <p class="press">PRESS ENTER</p>
  </div>
  <div id="version">AZZURRA · Step 0 title screen · Three.js · procedural · offline</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
